<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070A14">
<title>MEIHO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#070A14;color:#fff;font-family:system-ui;min-height:100vh}
.screen{display:none;min-height:100vh;flex-direction:column;background:#070A14}
.screen.active{display:flex}
#splash{background:#070A14;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;position:relative}
.logo{width:120px;height:120px;border:2px solid #FFFFFF;border-radius:50%;display:flex;align-items:center;justify-content:center;background:transparent}
.logo span{color:#2563EB;font-size:60px;font-weight:bold;animation:pulse 1.5s infinite;line-height:120px;text-align:center;width:120px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.from{position:absolute;bottom:20px;color:#9CA3AF;font-size:12px;letter-spacing:1px}
#guide{background:#070A14}
.guide-top{display:flex;justify-content:flex-end;padding:16px}
#passer{background:none;border:none;color:#9CA3AF;font-size:14px;cursor:pointer}
.page{display:none;flex-direction:column;align-items:center;text-align:center;padding:40px 20px;flex:1;justify-content:center}
.page.active{display:flex}
.page img{width:80px;height:80px;background:#1E293B;border-radius:16px;margin-bottom:12px;object-fit:cover}
.dots{display:flex;gap:8px;justify-content:center;margin:20px}
.dots span{width:8px;height:8px;border-radius:50%;background:#9CA3AF;display:inline-block}
.dots span.active{background:#2563EB;width:24px;border-radius:4px}
#nextBtn{background:#2563EB;color:#fff;border:none;border-radius:12px;padding:12px 24px;width:90%;margin:0 auto 24px;cursor:pointer}
#auth{padding:20px;justify-content:center}
#avatarBox{width:80px;height:80px;background:#1E293B;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;font-weight:bold}
#editPic{position:absolute;bottom:0;right:0;background:#2563EB;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;border:2px solid #070A14}
input,textarea{width:100%;background:#1E293B;color:#fff;border:none;border-radius:12px;padding:12px}
#pwdError{color:#ff4444;font-size:12px;display:none}
#officialCard{background:#1E293B;border-radius:12px;padding:12px;margin:10px;display:flex;align-items:center;gap:12px}
#chatList{flex:1;overflow:auto;padding-bottom:80px}
