<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEIHO</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="app">
  <!-- ECRAN DEMARRAGE -->
  <div id="splash" class="screen active">
    <div class="logo-pulse"><span>M</span></div>
    <p class="from-meiho">from meiho</p>
  </div>

  <!-- GUIDE 3 PAGES -->
  <div id="guide" class="screen">
    <div class="guide-dots"><span class="dot active"></span><span class="dot"></span><span class="dot"></span></div>
    <div id="guideContent"></div>
    <button id="nextGuide" class="btn-blue">Suivant</button>
    <button id="skipGuide" class="btn-skip">Passer</button>
  </div>

  <!-- LOGIN / INSCRIPTION -->
  <div id="auth" class="screen">
    <h2>@ Inscription</h2>
    <div class="photo-edit"><img id="previewPhoto" src="https://via.placeholder.com/80"><label for="photoInput" class="pencil">✏️</label><input type="file" id="photoInput" hidden accept="image/*"></div>
    <input id="pseudo" placeholder="@pseudo ex @Luc">
    <input id="pass" type="password" placeholder="Mot de passe 4 lettres + 4 chiffres ex Abcd1234">
    <textarea id="bio" maxlength="100" placeholder="Bio 100 caractères max"></textarea>
    <button onclick="register()" class="btn-blue">Créer compte</button>
    <p class="switch" onclick="showLogin()">Déjà compte? Login</p>
    <div id="loginBox" style="display:none">
      <input id="loginPseudo" placeholder="@pseudo">
      <input id="loginPass" type="password" placeholder="Mot de passe">
      <button onclick="login()" class="btn-blue">Se connecter</button>
    </div>
  </div>

  <!-- APP PRINCIPAL -->
  <div id="main" class="screen">
    <div class="top-bar">
      <h3>MEIHO</h3>
      <div class="top-icons">
        <span onclick="searchUser()">⌕</span>
        <span>◯</span>
        <span onclick="toggleMenu()">⋮</span>
      </div>
    </div>
    <div id="topMenu" class="dropdown"><div onclick="createGroupUI()">Nouveau groupe</div><div onclick="openSettings()">Paramètres</div><div onclick="changeLangUI()">Langue</div><div onclick="logout()" style="color:#EF4444">Déconnexion</div></div>

    <div id="content">
      <div id="tab-discussions" class="tab active"></div>
      <div id="tab-actus" class="tab"><h4 style="padding:15px">Invitations</h4><div id="invitationsList"></div></div>
      <div id="tab-communaute" class="tab"></div>
      <div id="tab-appel" class="tab"><p style="padding:20px;color:#9CA3AF">Appels récents 📞</p><div id="callsList"></div></div>
    </div>

    <div class="bottom-nav">
      <div class="nav-item active" onclick="switchTab('discussions')"><i>💬</i><span>Discussions</span><b id="notifCount" class="notif"></b></div>
      <div class="nav-item" onclick="switchTab('actus')"><i>📰</i><span>Actus</span></div>
      <div class="nav-item" onclick="switchTab('communaute')"><i>👥</i><span>Communauté</span></div>
      <div class="nav-item" onclick="switchTab('appel')"><i>📞</i><span>Appel</span></div>
    </div>
  </div>

  <!-- CHAT -->
  <div id="chat" class="screen">
    <div class="chat-top"><button onclick="backToMain()">←</button><img id="chatPhoto" src=""><div><b id="chatName"></b><span id="chatBadge"></span><br><small id="typingIndicator"></small></div><span style="margin-left:auto">📞 📹 ⋮</span></div>
    <div id="messages" class="messages"></div>
    <div class="input-bar"><span>📷</span><input id="msgInput" placeholder="Message" oninput="sendTyping()"><button onclick="sendMessage()">➤</button><span style="color:#2563EB">🎤</span></div>
  </div>
</div>
<script src="app.js"></script>
</body>
                                                                     </html>
